{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow">
            <div class="card-header bg-warning text-dark text-center fw-bold">Trắc Nghiệm Ôn Tập</div>
            <div class="card-body text-center p-4">
                <p class="text-muted mb-1">Nghĩa của từ này là gì?</p>
                <h2 class="text-primary fw-bold mb-4">{{ question.word }}</h2>

                <div class="d-grid gap-2">
                    {% for opt in options %}
                    <button class="btn btn-outline-primary py-2 text-start px-3" 
                            onclick="checkAnswer(this, '{{ opt.meaning }}', '{{ question.meaning }}')">
                        {{ opt.meaning }}
                    </button>
                    {% endfor %}
                </div>

                <div id="result" class="mt-4 fw-bold"></div>
                <a href="/quiz" class="btn btn-dark mt-3 d-none" id="next-btn">Câu Tiếp Theo &rarr;</a>
            </div>
        </div>
    </div>
</div>

<script>
function checkAnswer(button, selected, correct) {
    const buttons = document.querySelectorAll('.card-body button');
    buttons.forEach(btn => btn.disabled = true);

    const resultBox = document.getElementById('result');
    const nextBtn = document.getElementById('next-btn');

    if (selected === correct) {
        button.classList.remove('btn-outline-primary');
        button.classList.add('btn-success');
        resultBox.innerHTML = '<span class="text-success">Chính xác! Rất tốt.</span>';
    } else {
        button.classList.remove('btn-outline-primary');
        button.classList.add('btn-danger');
        resultBox.innerHTML = `<span class="text-danger">Chưa đúng! Đáp án đúng là: ${correct}</span>`;
    }
    nextBtn.classList.remove('d-none');
}
</script>
{% endblock %}
